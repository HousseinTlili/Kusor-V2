<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUSOR — Validation du graphe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16324F; --navy-deep:#0E2338; --slate:#3E5C76;
    --bg:#EEF1F5; --surface:#FFFFFF; --border:#D7DEE6;
    --text:#131B26; --text-muted:#5B6B7D;
    --teal:#1E7F6E; --teal-bg:#E4F2EF;
    --amber:#B8802E; --amber-bg:#FBF1E1;
    --red:#A6423A; --red-bg:#FAEBEA;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);}

  .topbar{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:#fff; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{font-family:'Newsreader',serif; font-weight:700; font-size:21px;}
  .brand .tag{font-size:12px; color:#B9C7D6; font-weight:500; border-left:1px solid rgba(255,255,255,0.25); padding-left:10px;}
  .top-right{display:flex; align-items:center; gap:14px;}
  .role-chip{background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); padding:5px 12px; border-radius:99px; font-size:12px; font-weight:600;}
  .queue-badge{background:#E2A23F; color:#3B2A08; font-weight:700; font-size:12px; padding:4px 10px; border-radius:99px;}
  button.icon-btn{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:7px; padding:6px 12px; font-size:12px; cursor:pointer;}
  button.icon-btn:hover{background:rgba(255,255,255,0.16);}
  .nav-links{display:flex; gap:4px; margin-left:24px;}
  .nav-link{
    color:#B9C7D6; text-decoration:none; font-size:12.5px; font-weight:600;
    padding:6px 12px; border-radius:7px; transition:all 0.15s;
  }
  .nav-link:hover{background:rgba(255,255,255,0.1); color:#fff;}
  .nav-link.active{background:rgba(255,255,255,0.15); color:#fff;}

  .layout{
    display:grid;
    grid-template-columns:380px 1fr;
    height:calc(100vh - 65px);
  }
  @media (max-width:900px){ .layout{grid-template-columns:1fr; height:auto;} }

  .queue-col{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .queue-header{padding:16px 18px 12px; border-bottom:1px solid var(--border);}
  .queue-header h2{font-family:'Newsreader',serif; font-size:16px; margin:0 0 10px; color:var(--navy-deep);}
  .filter-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .filter-chip{
    font-size:11px; font-weight:600; padding:5px 10px; border-radius:99px;
    border:1px solid var(--border); background:var(--bg); color:var(--text-muted);
    cursor:pointer; transition:all 0.15s;
  }
  .filter-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .queue-list{flex:1; overflow-y:auto; padding:8px;}
  .queue-item{
    padding:12px 12px; border-radius:9px; cursor:pointer;
    border:1px solid transparent; margin-bottom:4px;
    transition:background 0.15s;
  }
  .queue-item:hover{background:var(--bg);}
  .queue-item.selected{background:var(--teal-bg); border-color:#B9DED4;}
  .queue-item .rel-type{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding:2px 8px; border-radius:99px; display:inline-block; margin-bottom:6px;
  }
  .queue-item .rel-summary{font-size:13px; font-weight:600; color:var(--text);}
  .queue-item .rel-meta{font-size:11px; color:var(--text-muted); margin-top:3px; display:flex; justify-content:space-between;}
  .conf-tag{font-family:'IBM Plex Mono',monospace;}

  .type-modifies{background:#DCE6F0; color:var(--navy);}
  .type-abrogates{background:var(--red-bg); color:var(--red);}
  .type-references{background:#E7ECF3; color:var(--slate);}
  .type-complements{background:var(--teal-bg); color:var(--teal);}

  .detail-col{overflow-y:auto; padding:24px 28px;}
  .detail-empty{
    display:flex; align-items:center; justify-content:center; height:100%;
    color:var(--text-muted); font-size:14px; flex-direction:column; gap:8px;
  }
  .detail-empty .glyph{font-family:'Newsreader',serif; font-size:36px; color:var(--slate);}

  .detail-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    margin-bottom:20px; overflow:hidden;
  }
  .detail-header{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .detail-header h2{font-family:'Newsreader',serif; font-size:18px; margin:0; color:var(--navy-deep);}
  .detail-header .extracted-meta{font-size:11.5px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace;}

  .mini-graph{padding:30px 20px; display:flex; align-items:center; justify-content:center;}
  .mini-graph svg{width:100%; max-width:460px; height:120px;}

  .detail-body{padding:0 22px 22px;}
  .evidence-block{
    background:var(--bg); border-left:3px solid var(--navy); border-radius:6px;
    padding:14px 16px; font-size:13px; line-height:1.6; color:var(--text);
    margin-bottom:16px;
  }
  .evidence-block .label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); font-weight:700; margin-bottom:6px; display:block;}

  .meta-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
  .meta-cell{background:var(--bg); border-radius:8px; padding:10px 12px;}
  .meta-cell .k{font-size:10.5px; text-transform:uppercase; color:var(--text-muted); font-weight:600; letter-spacing:0.04em;}
  .meta-cell .v{font-family:'IBM Plex Mono',monospace; font-size:13px; margin-top:3px; color:var(--text);}

  .action-row{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    border:none; border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:opacity 0.15s;
  }
  .btn:hover{opacity:0.88;}
  .btn-validate{background:var(--teal); color:#fff;}
  .btn-reject{background:var(--red); color:#fff;}
  .btn-correct{background:#fff; border:1px solid var(--border); color:var(--slate);}

  .correct-form{
    display:none; margin-top:16px; padding:16px; background:var(--bg); border-radius:9px;
    border:1px dashed var(--border);
  }
  .correct-form.open{display:block;}
  .correct-form .field{margin-bottom:10px;}
  .correct-form label{display:block; font-size:11.5px; font-weight:600; color:var(--slate); margin-bottom:4px;}
  .correct-form select, .correct-form input{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px;
    font-family:'Inter',sans-serif; background:#fff;
  }

  .history-panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);}
  .history-panel .panel-header{padding:14px 20px; border-bottom:1px solid var(--border);}
  .history-panel h2{font-family:'Newsreader',serif; font-size:15px; margin:0; color:var(--navy-deep);}
  .history-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 20px; border-bottom:1px solid var(--border); font-size:12.5px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .hist-action{font-weight:600;}
  .history-item .hist-action.validated{color:var(--teal);}
  .history-item .hist-action.rejected{color:var(--red);}
  .history-item .hist-time{color:var(--text-muted); font-size:11px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep); color:#fff; padding:12px 20px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none; transition:all 0.25s;
    z-index:100;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">KUSOR</span>
    <span class="tag">Validation du graphe — relations extraites automatiquement</span>
  </div>
  <nav class="nav-links">
    <a href="/" class="nav-link">Chat</a>
    <a href="/test" class="nav-link">Console</a>
    <a href="/dashboard" class="nav-link">Dashboard</a>
    <a href="/admin" class="nav-link active">Admin</a>
  </nav>
  <div class="top-right">
    <span class="role-chip">Administrateur</span>
    <span class="queue-badge" id="queueCount">— en attente</span>
    <button class="icon-btn" onclick="alert('Branche cette console sur POST /api/graph/relations/{id}/validate et /reject côté Flask.')">⚙ API</button>
  </div>
</div>

<div class="layout">

  <div class="queue-col">
    <div class="queue-header">
      <h2>File d'attente</h2>
      <div class="filter-chips" id="filterChips">
        <span class="filter-chip active" data-filter="all">Toutes</span>
        <span class="filter-chip" data-filter="MODIFIES">Modifie</span>
        <span class="filter-chip" data-filter="ABROGATES">Abroge</span>
        <span class="filter-chip" data-filter="REFERENCES">Référence</span>
        <span class="filter-chip" data-filter="COMPLEMENTS">Complète</span>
      </div>
    </div>
    <div class="queue-list" id="queueList"></div>
  </div>

  <div class="detail-col" id="detailCol">
    <div class="detail-empty">
      <div class="glyph">⎇</div>
      Sélectionne une relation dans la file pour l'examiner.
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const TYPE_LABELS = {
  MODIFIES: 'Modifie', ABROGATES: 'Abroge', REFERENCES: 'Référence', COMPLEMENTS: 'Complète'
};
const TYPE_CLASSES = {
  MODIFIES: 'type-modifies', ABROGATES: 'type-abrogates', REFERENCES: 'type-references', COMPLEMENTS: 'type-complements'
};
const TYPE_COLORS = {
  MODIFIES: '#16324F', ABROGATES: '#A6423A', REFERENCES: '#3E5C76', COMPLEMENTS: '#1E7F6E'
};

let relations = [
  {
    id: 'r1', type: 'MODIFIES', source: '2024-06', target: '2023-02', confidence: 0.91,
    extracted_at: '2026-08-12 14:03', model: 'qwen2.5:7b',
    evidence: "« ...la présente circulaire modifie les dispositions de l'article 4 de la circulaire n°2023-02 relatives aux modalités de déclaration des transactions suspectes... »",
    status: 'pending'
  },
  {
    id: 'r2', type: 'ABROGATES', source: '2024-04', target: '2021-05', confidence: 0.64,
    extracted_at: '2026-08-12 14:05', model: 'qwen2.5:7b',
    evidence: "« ...abroge et remplace en conséquence les dispositions antérieures relatives au traitement des créances non performantes... »",
    status: 'pending'
  },
  {
    id: 'r3', type: 'REFERENCES', source: '2022-01', target: '2021-05', confidence: 0.88,
    extracted_at: '2026-08-11 09:40', model: 'qwen2.5:7b',
    evidence: "« ...conformément au cadre de gouvernance des banques défini par la circulaire n°2021-05... »",
    status: 'pending'
  },
  {
    id: 'r4', type: 'COMPLEMENTS', source: '2024-05', target: '2022-03', confidence: 0.77,
    extracted_at: '2026-08-11 09:42', model: 'qwen2.5:7b',
    evidence: "« ...vient compléter le dispositif KYC établi par la circulaire n°2022-03 s'agissant des personnes politiquement exposées... »",
    status: 'pending'
  },
  {
    id: 'r5', type: 'MODIFIES', source: '2024-07', target: '2024-01', confidence: 0.52,
    extracted_at: '2026-08-13 08:12', model: 'qwen2.5:7b',
    evidence: "« ...le ratio mentionné à l'article 2 est porté à un niveau différent de celui fixé précédemment... » (référence à la circulaire source ambiguë)",
    status: 'pending'
  },
];

let history = [
  {rel: '2023-01 → REFERENCES → 2021-05', action:'validated', time:'Hier, 17:22'},
  {rel: '2024-02 → MODIFIES → 2023-04', action:'rejected', time:'Hier, 16:05'},
];

let activeFilter = 'all';
let selectedId = null;

function confClass(conf){
  if(conf >= 0.8) return {label:'Confiance haute', cls:'teal'};
  if(conf >= 0.6) return {label:'Confiance moyenne', cls:'amber'};
  return {label:'Confiance faible', cls:'red'};
}

function renderQueue(){
  const list = document.getElementById('queueList');
  const pending = relations.filter(r => r.status === 'pending' && (activeFilter === 'all' || r.type === activeFilter));

  document.getElementById('queueCount').textContent = relations.filter(r=>r.status==='pending').length + ' en attente';

  if(!pending.length){
    list.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:13px;">File vide pour ce filtre 🎉</div>`;
    return;
  }

  list.innerHTML = pending.map(r => {
    const c = confClass(r.confidence);
    return `
      <div class="queue-item ${r.id===selectedId?'selected':''}" onclick="selectRelation('${r.id}')">
        <span class="rel-type ${TYPE_CLASSES[r.type]}">${TYPE_LABELS[r.type]}</span>
        <div class="rel-summary">${r.source} → ${r.target}</div>
        <div class="rel-meta">
          <span>${r.extracted_at}</span>
          <span class="conf-tag" style="color:var(--${c.cls===  'teal'?'teal':c.cls==='amber'?'amber':'red'})">${(r.confidence*100).toFixed(0)}%</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderMiniGraph(rel){
  const color = TYPE_COLORS[rel.type];
  return `
    <svg viewBox="0 0 460 120">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="${color}"/>
        </marker>
      </defs>
      <circle cx="70" cy="60" r="34" fill="#fff" stroke="${color}" stroke-width="2.5"/>
      <text x="70" y="65" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="600" fill="${color}">${rel.source}</text>
      <line x1="108" y1="60" x2="352" y2="60" stroke="${color}" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="175" y="40" width="110" height="22" rx="11" fill="${color}"/>
      <text x="230" y="55" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#fff">${TYPE_LABELS[rel.type].toUpperCase()}</text>
      <circle cx="390" cy="60" r="34" fill="#fff" stroke="${color}" stroke-width="2.5"/>
      <text x="390" y="65" text-anchor="middle" font-family="IBM Plex Mono" font-size="12" font-weight="600" fill="${color}">${rel.target}</text>
    </svg>
  `;
}

function selectRelation(id){
  selectedId = id;
  renderQueue();
  const rel = relations.find(r => r.id === id);
  const c = confClass(rel.confidence);
  const col = document.getElementById('detailCol');

  col.innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <h2>Circulaire ${rel.source} → ${rel.target}</h2>
        <span class="extracted-meta">extrait le ${rel.extracted_at}</span>
      </div>
      <div class="mini-graph">${renderMiniGraph(rel)}</div>
      <div class="detail-body">
        <div class="evidence-block">
          <span class="label">Passage source ayant motivé l'extraction</span>
          ${rel.evidence}
        </div>
        <div class="meta-grid">
          <div class="meta-cell"><div class="k">Type de relation</div><div class="v">${rel.type}</div></div>
          <div class="meta-cell"><div class="k">Confiance</div><div class="v">${(rel.confidence*100).toFixed(0)}% — ${c.label}</div></div>
          <div class="meta-cell"><div class="k">Modèle</div><div class="v">${rel.model}</div></div>
        </div>
        <div class="action-row">
          <button class="btn btn-validate" onclick="actOn('${rel.id}','validated')">✓ Valider</button>
          <button class="btn btn-reject" onclick="actOn('${rel.id}','rejected')">✗ Rejeter</button>
          <button class="btn btn-correct" onclick="toggleCorrect()">✎ Corriger</button>
        </div>
        <div class="correct-form" id="correctForm">
          <div class="field">
            <label>Type de relation corrigé</label>
            <select id="correctType">
              <option value="MODIFIES">Modifie</option>
              <option value="ABROGATES">Abroge</option>
              <option value="REFERENCES">Référence</option>
              <option value="COMPLEMENTS">Complète</option>
            </select>
          </div>
          <div class="field">
            <label>Circulaire cible corrigée</label>
            <input type="text" id="correctTarget" placeholder="ex. 2022-04" value="${rel.target}">
          </div>
          <button class="btn btn-validate" style="width:100%; justify-content:center;" onclick="submitCorrection('${rel.id}')">Enregistrer la correction et valider</button>
        </div>
      </div>
    </div>

    <div class="history-panel">
      <div class="panel-header"><h2>Historique récent</h2></div>
      <div id="historyList"></div>
    </div>
  `;
  document.getElementById('correctType').value = rel.type;
  renderHistory();
}

function toggleCorrect(){
  document.getElementById('correctForm').classList.toggle('open');
}

function submitCorrection(id){
  const rel = relations.find(r => r.id === id);
  rel.type = document.getElementById('correctType').value;
  rel.target = document.getElementById('correctTarget').value.trim() || rel.target;
  actOn(id, 'validated', true);
}

function actOn(id, action, corrected){
  const rel = relations.find(r => r.id === id);
  rel.status = action === 'validated' ? 'validated' : 'rejected';

  history.unshift({
    rel: `${rel.source} → ${TYPE_LABELS[rel.type]} → ${rel.target}${corrected ? ' (corrigé)' : ''}`,
    action, time: "À l'instant"
  });

  showToast(action === 'validated'
    ? `Relation ${rel.source} → ${rel.target} validée${corrected ? ' avec correction' : ''}.`
    : `Relation ${rel.source} → ${rel.target} rejetée.`);

  selectedId = null;
  document.getElementById('detailCol').innerHTML = `
    <div class="detail-empty"><div class="glyph">⎇</div>Sélectionne une relation dans la file pour l'examiner.</div>
  `;
  renderQueue();
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(!list) return;
  list.innerHTML = history.slice(0,6).map(h => `
    <div class="history-item">
      <div>
        <div class="hist-action ${h.action}">${h.action === 'validated' ? '✓ Validée' : '✗ Rejetée'}</div>
        <div>${h.rel}</div>
      </div>
      <div class="hist-time">${h.time}</div>
    </div>
  `).join('');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2600);
}

document.getElementById('filterChips').addEventListener('click', (e)=>{
  if(!e.target.classList.contains('filter-chip')) return;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  renderQueue();
});

renderQueue();
</script>

</body>
</html>
