version: '3.9'

services:
  neo4j:
    image: neo4j:5.18
    container_name: kusor_neo4j
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: neo4j/kusor_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    networks: [kusor_net]

  chromadb:
    image: chromadb/chroma:latest
    container_name: kusor_chroma
    ports:
      - '8001:8000'
    volumes:
      - chroma_data:/chroma/chroma
    networks: [kusor_net]

  postgres:
    image: postgres:16
    container_name: kusor_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: kusor_db
      POSTGRES_USER: kusor_user
      POSTGRES_PASSWORD: kusor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [kusor_net]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: kusor_backend
    command: sh -c "sleep 15 && python app.py"
    ports:
      - '5000:5000'
    environment:
      FLASK_ENV: production
      SECRET_KEY: change_this_to_a_random_secret_later
      JWT_SECRET_KEY: change_this_too_later
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: kusor_password
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      DATABASE_URL: postgresql://kusor_user:kusor_password@postgres:5432/kusor_db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_HOST: http://host.docker.internal:11434
      LLM_MODEL: qwen2.5:7b
      EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      - chromadb
      - neo4j
      - postgres
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [kusor_net]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: kusor_n8n
    ports:
      - '5678:5678'
    environment:
      - N8N_PORT=5678
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'kusor_backend:host-gateway'
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/n8n/workflows
    networks: [kusor_net]
    restart: unless-stopped

volumes:
  neo4j_data:
  chroma_data:
  postgres_data:
  n8n_data:

networks:
  kusor_net:
    driver: bridge

