version: '3.9'
services:
  neo4j:
    image: neo4j:5.18
    container_name: kusor_neo4j
    ports:
      - '7474:7474' # Web UI
      - '7687:7687' # Python Driver Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/kusor_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    networks: [kusor_net]

  chromadb:
    image: chromadb/chroma:latest
    container_name: kusor_chroma
    ports:
      - '8001:8000'
    volumes:
      - chroma_data:/chroma/chroma
    networks: [kusor_net]

  postgres:
    image: postgres:16
    container_name: kusor_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: kusor_db
      POSTGRES_USER: kusor_user
      POSTGRES_PASSWORD: kusor_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [kusor_net]

volumes:
  neo4j_data:
  chroma_data:
  postgres_data:

networks:
  kusor_net:
    driver: bridge
