<div class="login-wrapper">
  <div class="bg-gradient-glow"></div>
  <div class="login-card">
    <div class="card-header">
      <div class="logo">
        <span class="logo-dot"></span>
        <h1>KUSOR</h1>
      </div>
      <p class="subtitle">Assistant d'Intelligence Réglementaire — Attijari Bank</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      @if (errorMessage()) {
        <div class="alert alert-danger">
          {{ errorMessage() }}
        </div>
      }

      <div class="form-group">
        <label for="username">Identifiant</label>
        <input 
          type="text" 
          id="username" 
          formControlName="username" 
          placeholder="admin, user..." 
          class="form-control"
          [class.is-invalid]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="••••••••" 
          class="form-control"
          [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="btn-submit">
        @if (isLoading()) {
          Connexion en cours...
        } @else {
          Se connecter
        }
      </button>
    </form>
  </div>
</div>
